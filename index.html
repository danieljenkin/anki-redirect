<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Anki...</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f5; }
    .card { background: white; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    a { display: inline-block; margin-top: 1rem; padding: 12px 24px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
  </style>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '';
      const id = params.get('id') || '';

      const textPayload = name + "\nhttps://www.notion.so/" + id;
      
      // Android Intent scheme targeting AnkiDroid's SEND action
      const intentUrl = "intent:#Intent;" +
        "action=android.intent.action.SEND;" +
        "type=text/plain;" +
        "S.android.intent.extra.TEXT=" + encodeURIComponent(textPayload) + ";" +
        "package=com.ichi2.anki;" +
        "end";

      document.getElementById('open-btn').href = intentUrl;
      window.location.href = intentUrl;
    };
  </script>
</head>
<body>
  <div class="card">
    <p>Opening AnkiDroid...</p>
    <a id="open-btn" href="#">Tap Here to Add Note in Anki</a>
  </div>
</body>
</html>
